[project]
name = "bim-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mujoco>=3.6.0",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "uvicorn[standard]>=0.52.0",
    "websockets>=17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable standard linting rules
select = ["E", "F", "W", "I"]
# Set the indent width for linting as well
# This is used by some linting rules that care about indentation.

[tool.ruff.format]
# Use spaces for indentation
indent-style = "space"
# Use double quotes for strings
quote-style = "double"
