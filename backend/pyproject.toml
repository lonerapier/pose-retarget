[project]
name = "bim-backend"
version = "0.1.0"
description = "Webcam pose retargeting to a bimanual OpenArm in MuJoCo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mujoco>=3.6.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "scipy>=1.18.0",
    "uvicorn[standard]>=0.52.0",
    "websockets>=17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[dependency-groups]
dev = ["ipykernel>=7.3.0", "matplotlib>=3.11.1"]
